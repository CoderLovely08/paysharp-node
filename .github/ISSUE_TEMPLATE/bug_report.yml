name: Bug report
description: Report reproducible incorrect SDK behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API tokens, customer data, or unredacted production payloads.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.18.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: PaySharp environment
      options:
        - Sandbox
        - Production
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: javascript
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Sanitized response details
      description: Remove authorization headers, personal data, account-specific URLs, and sensitive identifiers.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and customer data from this report.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
